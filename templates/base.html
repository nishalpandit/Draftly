<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Draftly{% endblock %}</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1e293b;
            background-color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }
        .btn, .form-control, .card, .badge {
            border-radius: 8px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}bg-light{% endblock %}">
    {% block layout %}
    <nav class="navbar navbar-expand-lg navbar-white bg-white border-bottom py-2">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2 text-dark" href="{% url 'documents:dashboard' %}">
                <i class="bi bi-file-earmark-text-fill text-primary fs-4"></i>
                <span>Draftly</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                    <span class="text-secondary small d-none d-sm-inline">{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">Log in</a>
                    <a href="{% url 'signup' %}" class="btn btn-primary btn-sm">Sign up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
